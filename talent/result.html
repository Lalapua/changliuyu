<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#0B0B0F">
  <meta name="description" content="你的天赋是什么 · 结果页。仅供娱乐，不构成专业建议。">
  <title>我的天赋结果｜长留玉</title>

  <link rel="icon" href="../assets/ip.png">
  <link rel="apple-touch-icon" href="../assets/ip.png">

  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/quiz.css">
</head>
<body>

  <div class="app">

    <div class="quiz-top">
      <a class="quiz-top__back" href="index.html">
        <span aria-hidden="true">←</span> 返回
      </a>
      <span class="brand">
        <span class="brand__mark" data-clj-logo aria-hidden="true"></span>
        <span class="brand__name" data-clj-brand>长留玉</span>
      </span>
      <span class="chip chip--plain chip--sm" id="version-tag">轻量版</span>
    </div>

    <main class="app__main">

      <!-- 结果主视觉 -->
      <section class="card card--tint result-hero anim-up">
        <div>
          <div class="t-eyebrow" id="code-label">你的主天赋画像</div>
          <div class="result-hero__code result-hero__code--cjk" id="result-code">—</div>
        </div>
        <div>
          <p class="t-eyebrow" style="margin-bottom:6px;" id="combo-label">天赋组合</p>
          <h1 class="result-hero__title" id="result-title">正在计算…</h1>
        </div>
        <p class="result-hero__profile" id="result-profile"></p>
        <div class="tag-row" id="strength-tags"></div>
        <p class="result-hero__spread" id="result-spread"></p>
      </section>

      <!-- 雷达图 -->
      <section class="card anim-up d-1">
        <div class="section-head">
          <h2 class="section-head__title">八项能力图谱</h2>
          <span class="section-head__hint">满分 100</span>
        </div>
        <div class="radar-holder" id="radar-holder"></div>
      </section>

      <!-- 维度明细 -->
      <section class="card anim-up d-2">
        <div class="section-head">
          <h2 class="section-head__title">八项明细</h2>
          <span class="section-head__hint">由高到低</span>
        </div>
        <div class="dim-bars" id="dim-bars"></div>
      </section>

      <!-- 主天赋画像详解 -->
      <section class="card anim-up d-3" id="talent-main">
        <div class="section-head">
          <h2 class="section-head__title" id="talent-name">你的天赋画像</h2>
        </div>
        <p class="t-body" id="talent-desc"></p>
        <div class="advice-list" id="talent-watch"></div>
      </section>

      <!-- 和你最像的名人 -->
      <section id="figures-wrap">
        <div class="section-head">
          <h2 class="section-head__title">和你最像的名人</h2>
          <span class="section-head__hint">只比思维方式，图个乐</span>
        </div>
        <!-- 所有卡片（含最像的那张）都放进同一个 flex 容器：
             间距由 flex gap 统一给，不再靠「两个容器之间的空隙」来凑，
             否则首卡和其他卡的间距会被容器的边距差异带偏。 -->
        <div class="stack-2" id="figure-list"></div>
      </section>

      <!-- 操作 -->
      <section class="result-actions">
        <button class="btn btn--primary" id="btn-save-img" type="button">保存结果图片</button>
        <div class="result-actions__row">
          <button class="btn btn--quiet" id="btn-retry" type="button">重新测试</button>
          <button class="btn btn--quiet" id="btn-home" type="button">返回首页</button>
        </div>
      </section>

      <!-- 推荐其它测试 -->
      <section>
        <div class="section-head">
          <h2 class="section-head__title">你可能还想测</h2>
        </div>
        <div class="stack-2" id="other-tests"></div>
      </section>

      <p class="t-small center" data-clj-disclaimer></p>

    </main>

    <footer class="footer">
      <div class="footer__brand">
        <span class="footer__dot" aria-hidden="true"></span>
        <span data-clj-brand>长留玉</span>
      </div>
      <p class="footer__note" data-clj-disclaimer></p>
    </footer>

  </div>

  <!-- 脚本顺序不能乱：config → global → 题库 → 画像库 → 算法 → 数据层 → 二维码 → 海报 → 页面逻辑 -->
  <script src="../js/config.js"></script>
  <script src="../js/global.js"></script>
  <script src="../js/talent/questions-light.js"></script>
  <script src="../js/talent/questions-full.js"></script>
  <script src="../js/talent/scoring.js"></script>
  <script src="../js/talent/talents.js"></script>
  <script src="../js/talent/figures.js"></script>
  <script src="../js/talent/data.js"></script>
  <script src="../js/qr.js"></script>
  <script src="../js/radar.js"></script>
  <script src="../js/poster.js"></script>
  <script src="../js/save.js"></script>
  <script src="../js/talent/result.js"></script>
</body>
</html>
